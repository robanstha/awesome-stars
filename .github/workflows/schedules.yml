name: update awesome-stars
on:
  schedule:
  - cron: 0 * * * *
  push:
    paths:
    - .github/workflows/schedules.yml
jobs:
  awesome-stars:
    name: update awesome-stars
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Set up Python
      uses: actions/setup-python@v1
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install starred requests
    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global credential.helper store
    - name: Store git credentials
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
    - name: update repo
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: starred --username robanstha --repository awesome-stars --sort --token ${GH_TOKEN} --message 'stars update by github actions cron'
